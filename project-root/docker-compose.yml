name: ${COMPOSE_PROJECT_NAME:-odoo18_prod}

services:
  db:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-odoo18_prod}_db
    restart: always
    stop_grace_period: 60s
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - checkpoint_completion_target=0.9
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  odoo:
    image: odoo:${ODOO_VERSION:-18.0}
    container_name: ${COMPOSE_PROJECT_NAME:-odoo18_prod}_odoo
    restart: always
    init: true
    stop_grace_period: 120s
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
      ODOO_DB_FILTER: ${ODOO_DB_FILTER}
      ODOO_WORKERS: ${ODOO_WORKERS:-2}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-1}
      ODOO_LIMIT_MEMORY_SOFT: ${ODOO_LIMIT_MEMORY_SOFT:-2147483648}
      ODOO_LIMIT_MEMORY_HARD: ${ODOO_LIMIT_MEMORY_HARD:-2684354560}
      ODOO_LIMIT_TIME_CPU: ${ODOO_LIMIT_TIME_CPU:-600}
      ODOO_LIMIT_TIME_REAL: ${ODOO_LIMIT_TIME_REAL:-1200}
    command:
      - /bin/sh
      - -c
      - |
        /usr/local/bin/wait-for-db.sh "$$HOST" "$$PORT" 60
        exec odoo \
          -d "$$POSTGRES_DB" \
          --db_host="$$HOST" \
          --db_port="$$PORT" \
          --db_user="$$USER" \
          --db_password="$$PASSWORD" \
          --proxy-mode \
          --admin-passwd="$$ODOO_MASTER_PASSWORD" \
          --db-filter="$$ODOO_DB_FILTER" \
          --workers="$$ODOO_WORKERS" \
          --max-cron-threads="$$ODOO_MAX_CRON_THREADS" \
          --limit-memory-soft="$$ODOO_LIMIT_MEMORY_SOFT" \
          --limit-memory-hard="$$ODOO_LIMIT_MEMORY_HARD" \
          --limit-time-cpu="$$ODOO_LIMIT_TIME_CPU" \
          --limit-time-real="$$ODOO_LIMIT_TIME_REAL"
    volumes:
      - odoo_filestore:/var/lib/odoo
      - ./odoo/config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo/addons:/mnt/extra-addons
      - ./scripts/wait-for-db.sh:/usr/local/bin/wait-for-db.sh:ro
    expose:
      - "8069"
      - "8072"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"

  nginx:
    image: nginx:${NGINX_VERSION:-stable-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-odoo18_prod}_nginx
    restart: always
    read_only: true
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $$!; nginx -s reload; done &
      nginx -g 'daemon off;'"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:${CERTBOT_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-odoo18_prod}_certbot
    restart: always
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $$!;
      done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "certbot --version >/dev/null 2>&1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  odoo_filestore:
  letsencrypt:
  certbot_www:
