services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/odoo-source:19
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-odoo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ADDONS_PATH: /opt/odoo/addons,/opt/odoo/odoo/addons
      HTTP_PORT: 8070
      PROXY_MODE: True
      WORKERS: ${ODOO_WORKERS:-0}
      MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-1}
    expose:
      - "8070"
    volumes:
      - .:/opt/odoo:ro
      - odoo-data:/var/lib/odoo
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/web/login', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "${ODOO_HTTPS_PORT:-8069}:8069"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1:8069/web/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  odoo-data:
  caddy-data:
  caddy-config:
